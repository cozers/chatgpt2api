name: Sync Upstream

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/ZyphrZero/chatgpt2api.git 2>/dev/null || \
            git remote set-url upstream https://github.com/ZyphrZero/chatgpt2api.git
          git fetch upstream main
          git fetch upstream "refs/tags/v*:refs/tags/upstream/v*"

      - name: Merge upstream main
        run: |
          git checkout -B "${GITHUB_REF_NAME}" "origin/${GITHUB_REF_NAME}"
          git merge --no-edit upstream/main

      - name: Push branch
        run: git push origin HEAD:"${GITHUB_REF_NAME}"

      - name: Sync upstream release tags
        run: |
          current_head="$(git rev-parse HEAD)"
          for tag in $(git tag -l 'upstream/v*' | sed 's#^upstream/##'); do
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
              continue
            fi
            body="$(git for-each-ref --format='%(contents)' "refs/tags/upstream/${tag}")"
            git tag -a -f "${tag}" "${current_head}" -m "${body:-${tag}}"
            git push origin "refs/tags/${tag}"
          done
